<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Sweet Wishes - การ์ดอวยพรวันเกิด"
  >

  <title>Sweet Wishes 🎂</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Itim&family=Kanit:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  >

  <!-- CSS -->
  <link rel="stylesheet" href="style.css?v=20260909">

</head>

<body>

  <!-- Background -->
  <div id="particles"></div>

  <main>

    <section id="cardPage" class="page active">

      <!-- =========================
           MAIN CARD
           ========================= -->

      <div
        id="fullCard"
        class="full-card theme-pink"
      >

        <!-- Decorative sparkles -->
        <div class="sparkles">
          ✦　✧　✦　✧　✦
        </div>


        <!-- Small heading -->
        <p class="card-kicker">
          A SPECIAL WISH FOR YOU
        </p>


        <!-- Birthday title -->
        <h1 id="cardTitle">
          Happy Birthday!
        </h1>


        <!-- Recipient -->
        <div
          id="cardRecipient"
          class="recipient-name"
        >
          ชื่อคนรับ
        </div>


        <!-- =========================
             CAKE
             ========================= -->

        <div class="cake-stage">

          <div
            id="cake"
            class="cake"
            aria-label="เค้กวันเกิด"
          >

            <!-- Flames -->
            <div class="flame-row">
              <span class="flame">🔥</span>
              <span class="flame">🔥</span>
              <span class="flame">🔥</span>
            </div>


            <!-- Candles -->
            <div class="candles">
              <i></i>
              <i></i>
              <i></i>
            </div>


            <!-- Strawberries -->
            <div class="cake-top">
              🍓　🍓　🍓
            </div>


            <!-- Cake -->
            <div class="cake-body">
              🎂
            </div>

          </div>


          <!-- Blow candles -->
          <button
            id="blowBtn"
            class="secondary-btn"
            type="button"
          >
            🌬️ เป่าเทียน
          </button>


          <!-- After blowing -->
          <p
            id="blowMessage"
            class="blow-message hidden"
          >
            ✨ ขอให้คำอวยพรเป็นจริงทุกอย่างเลยนะ! ✨
          </p>

        </div>


        <!-- =========================
             MESSAGE
             ========================= -->

        <div class="message-box">

          <p id="cardMessage">
            ขอให้มีความสุขมาก ๆ...
          </p>

        </div>


        <!-- =========================
             GALLERY
             ========================= -->

        <div
          id="gallery"
          class="gallery"
        ></div>


        <!-- =========================
             MUSIC
             ========================= -->

        <div
          id="musicPlayer"
          class="music-player hidden"
        >

          <div class="music-title">
            🎵
            <span id="musicName">
              เพลงของเรา
            </span>
          </div>


          <a
            id="musicLink"
            class="primary-btn music-link"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
          >
            ▶️ เปิดเพลง
          </a>

        </div>


        <!-- =========================
             SENDER
             ========================= -->

        <p
          id="cardSender"
          class="sender"
        >
          — จากใคร —
        </p>


        <!-- Footer -->
        <div class="card-footer">
          Made with 💗
        </div>

      </div>

    </section>

  </main>


  <!-- JavaScript -->
  <script src="script.js?v=20260909" defer></script>

</body>
</html>
