```
<!-- CARD -->
<section id="cardPage" class="page active">

  <div class="card-toolbar">
    <button class="ghost-btn" id="shareBtn">🔗 แชร์</button>
    <button class="ghost-btn" id="qrBtn">📱 QR Code</button>
  </div>

  <div id="fullCard" class="full-card theme-pink">

    <div class="sparkles">
      ✦　✧　✦　✧　✦
    </div>

    <p class="card-kicker">
      A SPECIAL WISH FOR YOU
    </p>

    <h1 id="cardTitle">
      Happy Birthday!
    </h1>

    <div class="recipient-name" id="cardRecipient">
      ชื่อคนรับ
    </div>

    <!-- CAKE -->
    <div class="cake-stage">

      <div id="cake" class="cake" aria-label="เค้กวันเกิด">

        <div class="flame-row">
          <span class="flame">🔥</span>
          <span class="flame">🔥</span>
          <span class="flame">🔥</span>
        </div>

        <div class="candles">
          <i></i>
          <i></i>
          <i></i>
        </div>

        <div class="cake-top">
          🍓　🍓　🍓
        </div>

        <div class="cake-body">
          🎂
        </div>

      </div>

      <button id="blowBtn" class="secondary-btn">
        🌬️ เป่าเทียน
      </button>

      <p id="blowMessage" class="hidden">
        ✨ ขอให้คำอวยพรเป็นจริงทุกอย่างเลยนะ! ✨
      </p>

    </div>

    <!-- MESSAGE -->
    <div class="message-box">
      <p id="cardMessage">
        ขอให้มีความสุขมาก ๆ...
      </p>
    </div>

    <!-- GALLERY -->
    <div id="gallery" class="gallery"></div>

    <!-- MUSIC -->
    <div id="musicPlayer" class="music-player hidden">

      <div>
        🎵
        <span id="musicName">
          เพลงของเรา
        </span>
      </div>

      <a
        id="musicLink"
        class="primary-btn music-link"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
      >
        ▶️ เปิดเพลง
      </a>

    </div>

    <!-- SENDER -->
    <p class="sender" id="cardSender">
      — จากใคร —
    </p>

    <div class="card-footer">
      Made with 💗
    </div>

  </div>

  <!-- QR MODAL -->
  <div id="qrModal" class="modal hidden">

    <div class="modal-box">

      <button class="close-btn" id="closeQr">
        ×
      </button>

      <h2>
        📱 สแกนเพื่อเปิดการ์ด
      </h2>

      <div id="qrcode"></div>

      <p>
        นำกล้องมือถือสแกน QR Code นี้
      </p>

      <button class="primary-btn" id="copyLinkBtn">
        🔗 คัดลอกลิงก์
      </button>

      <small id="qrWarning"></small>

    </div>

  </div>

</section>
