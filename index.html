<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Sweet Wishes - การ์ดอวยพรวันเกิด"
  >

  <title>Sweet Wishes 🎂</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Itim&family=Kanit:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Background particles -->
  <div id="particles"></div>

  <main>

    <!-- =====================================================
         CARD PAGE
         ===================================================== -->

    <section id="cardPage" class="page active">

      <!-- Toolbar -->
      <div class="card-toolbar">

        <button
          type="button"
          class="ghost-btn"
          id="shareBtn"
        >
          🔗 แชร์
        </button>

        <button
          type="button"
          class="ghost-btn"
          id="qrBtn"
        >
          📱 QR Code
        </button>

      </div>


      <!-- ===================================================
           MAIN CARD
           =================================================== -->

      <div
        id="fullCard"
        class="full-card theme-pink"
      >

        <!-- Decorations -->
        <div class="sparkles">
          ✦　✧　✦　✧　✦
        </div>

        <p class="card-kicker">
          A SPECIAL WISH FOR YOU
        </p>


        <!-- Title -->
        <h1 id="cardTitle">
          Happy Birthday!
        </h1>


        <!-- Recipient -->
        <div
          class="recipient-name"
          id="cardRecipient"
        >
          ชื่อคนรับ
        </div>


        <!-- =================================================
             CAKE
             ================================================= -->

        <div class="cake-stage">

          <div
            id="cake"
            class="cake"
            aria-label="เค้กวันเกิด"
          >

            <div class="flame-row">

              <span class="flame">🔥</span>
              <span class="flame">🔥</span>
              <span class="flame">🔥</span>

            </div>

            <div class="candles">

              <i></i>
              <i></i>
              <i></i>

            </div>

            <div class="cake-top">
              🍓　🍓　🍓
            </div>

            <div class="cake-body">
              🎂
            </div>

          </div>


          <button
            type="button"
            id="blowBtn"
            class="secondary-btn"
          >
            🌬️ เป่าเทียน
          </button>


          <p
            id="blowMessage"
            class="blow-message hidden"
          >
            ✨ ขอให้คำอวยพรเป็นจริงทุกอย่างเลยนะ! ✨
          </p>

        </div>


        <!-- =================================================
             MESSAGE
             ================================================= -->

        <div class="message-box">

          <p id="cardMessage">
            ขอให้มีความสุขมาก ๆ...
          </p>

        </div>


        <!-- =================================================
             GALLERY
             ================================================= -->

        <div
          id="gallery"
          class="gallery"
        ></div>


        <!-- =================================================
             MUSIC
             ================================================= -->

        <div
          id="musicPlayer"
          class="music-player hidden"
        >

          <div class="music-title">
            🎵
            <span id="musicName">
              เพลงของเรา
            </span>
          </div>

          <a
            id="musicLink"
            class="primary-btn music-link"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
          >
            ▶️ เปิดเพลง
          </a>

        </div>


        <!-- =================================================
             SENDER
             ================================================= -->

        <p
          class="sender"
          id="cardSender"
        >
          — จากใคร —
        </p>


        <!-- Footer -->
        <div class="card-footer">
          Made with 💗
        </div>

      </div>


      <!-- ===================================================
           QR MODAL
           =================================================== -->

      <div
        id="qrModal"
        class="modal hidden"
      >

        <div class="modal-box">

          <button
            type="button"
            class="close-btn"
            id="closeQr"
            aria-label="ปิด"
          >
            ×
          </button>


          <h2>
            📱 สแกนเพื่อเปิดการ์ด
          </h2>


          <div id="qrcode"></div>


          <p>
            นำกล้องมือถือสแกน QR Code นี้
          </p>


          <button
            type="button"
            class="primary-btn"
            id="copyLinkBtn"
          >
            🔗 คัดลอกลิงก์
          </button>


          <small id="qrWarning"></small>

        </div>

      </div>

    </section>

  </main>


  <!-- JavaScript -->
  <script src="script.js" defer></script>

</body>
</html>
